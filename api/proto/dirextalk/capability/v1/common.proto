syntax = "proto3";

package dirextalk.capability.v1;

option go_package = "github.com/YingSuiAI/dirextalk-capability-api/gen/go/dirextalk/capability/v1;capabilityv1";

// CallContext 携带调用链追踪信息，用于循环检测和超时传播
message CallContext {
  // chain_id 是本次端到端请求的唯一标识（UUID）
  string chain_id = 1;

  // root_operation_id 是触发此调用链的最初 operation ID
  string root_operation_id = 2;

  // parent_call_id 是上一跳的调用 ID（UUID）
  string parent_call_id = 3;

  // hop 是当前调用深度，从 0 开始
  int32 hop = 4;

  // route 记录调用路径，格式如 "flutter→ms→agent→ms"
  string route = 5;

  // deadline_unix_ms 是整个调用链的截止时间（Unix 毫秒）
  int64 deadline_unix_ms = 6;
}

// PermissionContext 携带权限上下文，由 message-server 验证后填充
message PermissionContext {
  // authenticated_owner_id 是已验证的 owner ID
  string authenticated_owner_id = 1;

  // granted_scopes 是授予的权限范围列表
  repeated string granted_scopes = 2;

  // capability_grant 是 message-server 签发的不可篡改 grant（opaque bytes）
  bytes capability_grant = 3;

  // account_generation 是账号生成标识，用于检测账号删除/重建
  int64 account_generation = 4;
}

// OperationState 定义 operation 的状态机
enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_PENDING = 1;      // 已接受，等待执行
  OPERATION_STATE_RUNNING = 2;      // 执行中
  OPERATION_STATE_COMPLETED = 3;    // 成功完成
  OPERATION_STATE_FAILED = 4;       // 失败
  OPERATION_STATE_CANCELLED = 5;    // 已取消
  OPERATION_STATE_UNCERTAIN = 6;    // 不确定状态，需要 reconcile
}

// ErrorCode 定义标准错误码
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_TRUST_FAILED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_PRECONDITION_FAILED = 6;
  ERROR_CODE_NOT_READY = 7;
  ERROR_CODE_INCOMPATIBLE = 8;
  ERROR_CODE_UNAVAILABLE = 9;
  ERROR_CODE_UNCERTAIN = 10;
  ERROR_CODE_UPSTREAM_FAILED = 11;
  ERROR_CODE_CYCLE_DETECTED = 12;
  ERROR_CODE_RESOURCE_EXHAUSTED = 13;
}

// CapabilityError 是标准错误响应
message CapabilityError {
  ErrorCode code = 1;
  string message = 2;
  // details 可包含额外的诊断信息（不包含 secrets）
  map<string, string> details = 3;
}

// OperationType 定义 operation 的类型
enum OperationType {
  OPERATION_TYPE_UNSPECIFIED = 0;
  OPERATION_TYPE_READ = 1;            // 无副作用读取
  OPERATION_TYPE_MUTATION = 2;        // 有副作用的变更
  OPERATION_TYPE_DURABLE_STREAM = 3;  // 持久化流式操作
}

// Audience 定义 capability 的受众
enum Audience {
  AUDIENCE_UNSPECIFIED = 0;
  AUDIENCE_OWNER_CLIENT = 1;    // Flutter 客户端
  AUDIENCE_NATIVE_AGENT = 2;    // Agent 内部
  AUDIENCE_EXTERNAL_MCP = 3;    // 外部 MCP 客户端
}

// RiskLevel 定义操作的风险级别
enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_SAFE = 1;        // 安全操作
  RISK_LEVEL_LOW = 2;         // 低风险
  RISK_LEVEL_MEDIUM = 3;      // 中风险
  RISK_LEVEL_HIGH = 4;        // 高风险，需要确认
  RISK_LEVEL_CRITICAL = 5;    // 关键操作，需要显式确认
}
